# Database Configuration - supports both local and Docker environments
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cohost_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cohost_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1202}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=${SERVER_PORT:8080}

# CORS Configuration (allow frontend access)
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT Configuration
app.jwtSecret=${JWT_SECRET:K/Tuz/XDC9a6++V5SNGD/QmZ+86og6L3n1zdh4CrDsQ9S2x/fObgrhTbg/sgIpkLMVCz/w7RK6XyF19C9xWN3g==}
app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# Actuator for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized